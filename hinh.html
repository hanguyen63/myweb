     body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
     header { background: #4CAF50; color: white; padding: 1px; text-align: center; }

/* Navigation Bar */
    .navbar {
      list-style-type: none;
      margin: 0;
      padding: 10;
      background-color: #004d40;
      display: flex;
      align-items: center;
    }

    .navbar > li {
      position: relative;
    }

    .navbar li a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 7px 10px;
    }

    .navbar li a:hover {
      background-color: #00695c;   
    text-decoration: underline;  
    }

    .submenu {
      display: none;
      position: absolute;
      background-color:  #00695c;
      min-width: 120px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
        left: 0;
 
    }

    .submenu li {
      display: block;

    }

    /* Show submenu on hover */
    li:hover .submenu {
      display: block;       
    }

.sub-nav {
      background: #e0f2f1;
      padding: 10px;
      text-align: center;
    }
    .sub-nav a {
      margin: 0 10px;
      color: #00695c;
      text-decoration: none;
      font-weight: bold;
    }


    .section { padding: 1rem; }
    .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .card {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
      background-color: #fafafa;
    }
    .card img { width: 100%; height: auto; border-radius: 10px; }

 
 
.video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-container {
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    iframe {
      width: 100%;
      height: 200px;
      border-radius: 10px;
    }

    @media (min-width: 768px) {
      iframe {
        height: 250px;
      }
    }

    @media (min-width: 1024px) {
      iframe {
        height: 300px;
      }
    }
.zoom-img {
    transition: transform 0.3s ease;
    cursor: zoom-in;
  }

  .zoom-img:hover {
    transform: scale(1.5);
    z-index: 2;
  }
footer {

      color: white;
      padding: 1px;
      text-align: center;
      font-size: 0.9em;
      text-decoration: none;
    }

<script>

function updateDateTime() {
  const now = new Date();
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const dateStr = now.toLocaleDateString('vi-VN', options);
  const timeStr = now.toLocaleTimeString('vi-VN');
  document.getElementById('datetime').textContent = `${dateStr} - ${timeStr}`;
}
setInterval(updateDateTime, 1000);
updateDateTime();
</script>
